<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Profile footer</title>
  <desc id="desc">Keep building, keep shipping, keep asking better questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="0.5" stop-color="#12355b" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="24" fill="url(#bg)" />
  <path d="M 40 48 H 1160" stroke="#22d3ee" stroke-opacity="0.7" />
  <text x="600" y="91" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">KEEP BUILDING  ·  KEEP SHIPPING  ·  KEEP ASKING BETTER QUESTIONS</text>
  <text x="600" y="122" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">see you in the next experiment</text>
</svg>
