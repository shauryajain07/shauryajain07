<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Dynamicfire07 GitHub profile header</title>
  <desc id="desc">A dark technical header for Shaurya, featuring AI, data, hardware, football, and ROOT19.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#12355b" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)" />
  <rect width="1200" height="320" rx="26" fill="url(#grid)" />
  <circle cx="1050" cy="-10" r="210" fill="#22d3ee" opacity="0.12" />
  <circle cx="1120" cy="310" r="170" fill="#a78bfa" opacity="0.11" />
  <path d="M 0 275 C 220 230, 320 330, 525 266 S 875 205, 1200 250" fill="none" stroke="url(#glow)" stroke-width="3" filter="url(#softGlow)" />
  <path d="M 0 279 C 220 234, 320 334, 525 270 S 875 209, 1200 254" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" />
  <g fill="#22d3ee">
    <circle cx="930" cy="88" r="4" /><circle cx="966" cy="110" r="2" /><circle cx="1010" cy="72" r="3" /><circle cx="1084" cy="132" r="2" /><circle cx="1140" cy="82" r="3" />
  </g>
  <text x="76" y="142" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="800" letter-spacing="2">DYNAMICFIRE07</text>
  <text x="80" y="184" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4">AI  ×  DATA  ×  HARDWARE  ×  FOOTBALL</text>
  <text x="80" y="232" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">building systems that do something useful</text>
  <text x="1080" y="62" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">ROOT19</text>
  <text x="1080" y="86" text-anchor="middle" fill="#ffffff" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">PROFILE // ONLINE</text>
  <rect x="80" y="263" width="250" height="2" rx="1" fill="#22d3ee" />
  <rect x="338" y="263" width="60" height="2" rx="1" fill="#a78bfa" />
</svg>
