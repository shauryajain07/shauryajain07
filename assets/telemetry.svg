<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Dynamicfire07 build telemetry</title>
  <desc id="desc">Four panels showing AI systems, retrieval, machine learning, and hardware experiments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f" /><stop offset="1" stop-color="#12355b" /></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" /><stop offset="1" stop-color="#a78bfa" /></linearGradient>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)" />
  <text x="48" y="44" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">BUILD TELEMETRY // LIVE IN THE REPO</text>
  <path d="M 48 62 H 1152" stroke="#22d3ee" stroke-opacity="0.4" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(48 88)"><rect width="250" height="112" rx="14" fill="#0b1d31" stroke="#22d3ee" stroke-opacity="0.35" /><text x="22" y="35" fill="#22d3ee" font-size="14">[01] AI SYSTEMS</text><text x="22" y="67" fill="#ffffff" font-size="24">Doubtabase</text><text x="22" y="91" fill="#94a3b8" font-size="12">capture → retrieve → learn</text></g>
    <g transform="translate(322 88)"><rect width="250" height="112" rx="14" fill="#0b1d31" stroke="#a78bfa" stroke-opacity="0.45" /><text x="22" y="35" fill="#c4b5fd" font-size="14">[02] RETRIEVAL</text><text x="22" y="67" fill="#ffffff" font-size="24">RAG / vectors</text><text x="22" y="91" fill="#94a3b8" font-size="12">find signal in noise</text></g>
    <g transform="translate(596 88)"><rect width="250" height="112" rx="14" fill="#0b1d31" stroke="#f59e0b" stroke-opacity="0.45" /><text x="22" y="35" fill="#fbbf24" font-size="14">[03] PREDICTION</text><text x="22" y="67" fill="#ffffff" font-size="24">football + ML</text><text x="22" y="91" fill="#94a3b8" font-size="12">confidence, calibrated</text></g>
    <g transform="translate(870 88)"><rect width="282" height="112" rx="14" fill="#0b1d31" stroke="#34d399" stroke-opacity="0.45" /><text x="22" y="35" fill="#6ee7b7" font-size="14">[04] HARDWARE</text><text x="22" y="67" fill="#ffffff" font-size="24">Pi + NFC</text><text x="22" y="91" fill="#94a3b8" font-size="12">software leaves the browser</text></g>
  </g>
  <path d="M 48 226 H 1152" stroke="url(#line)" stroke-width="3" stroke-linecap="round" />
</svg>
